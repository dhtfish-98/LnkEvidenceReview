[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lnk-evidence-review"
version = "0.1.2"
description = "Bounded offline Windows Shell Link structure and reference metadata evidence"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE"]
authors = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
lnk-evidence-review = "lnk_evidence_review.cli:main"

[project.urls]
Repository = "https://github.com/dhtfish-98/LnkEvidenceReview"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lnk_evidence_review = ["py.typed"]

[tool.setuptools.data-files]
"share/lnk-evidence-review" = ["项目文档/ORIGIN.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/VALIDATION.md", "项目文档/SOURCE_REVIEW.json", "项目文档/SOURCE_AUDIT.json", "requirements-build.lock"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
